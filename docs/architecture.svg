<path d="M320 395H418" stroke="#64708a" fill="none" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ah)"/>
<rect x="319.25" y="366" width="101.5" height="21" rx="6" fill="#eef1f6"/><text x="370" y="381" font-size="12.5" font-weight="700" fill="#4a5468" text-anchor="middle">PDF を取得</text>

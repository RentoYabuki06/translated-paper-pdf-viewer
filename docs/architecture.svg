<text x="150" y="174" font-size="18" font-weight="700" fill="#1a2233">Hugging Face</text>
<text x="150" y="196" font-size="13" fill="#5d6779">モデルの配布元</text>
<text x="150" y="215" font-size="13" fill="#5d6779">取得は、初回の 1 回だけ</text>

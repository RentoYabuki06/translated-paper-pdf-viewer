<rect x="920" y="412" width="52" height="52" rx="12" fill="#efeafb"/>
<g transform="translate(946 438)"><path d="M0-14l12 7v14l-12 7l-12-7v-14z M-12-7l12 7l12-7M0 0v14" fill="none" stroke="#6b4fbb" stroke-width="2.3" stroke-linejoin="round"/></g>
<text x="990" y="434" font-size="18" font-weight="700" fill="#1a2233">Ollama</text>
<text x="990" y="456" font-size="13" fill="#5d6779">llama-server の代わりに使える</text>
<rect x="1156" y="402" width="50" height="22" rx="11" fill="#eef1f6"/><text x="1181" y="417" font-size="11.5" font-weight="700" fill="#5d6779" text-anchor="middle">任意</text>

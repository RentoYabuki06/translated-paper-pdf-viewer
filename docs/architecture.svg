<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c2740" flood-opacity="0.10"/></filter>
</defs>
<rect x="0.5" y="0.5" width="1279" height="679" rx="22" fill="#f4f6f9" stroke="#dfe3ea"/>
<rect x="40" y="40" width="300" height="560" rx="18" fill="#eef1f6" stroke="#c9cfdb" stroke-dasharray="3 5"/>
